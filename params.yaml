# Пока здесь только то, что нужно для генерации данных.
# По ходу курса этот файл вырастет: занятие 3 — гиперпараметры,
# занятие 5 — пути стадий, занятие 6 — настройки MLflow.

seed: &seed 42

data:
  n_samples: 20000
  raw_path: data/raw/churn.csv
  processed_dir: data/processed
  test_size: 0.2
  val_size: 0.1

features:
  numeric:
    - tenure_months
    - monthly_charges
    - total_charges
    - num_support_calls
    - avg_monthly_gb
  categorical:
    - contract_type
    - internet_service
    - payment_method
  binary:
    - has_tech_support
    - is_senior

train:
  model: logreg
  logreg:
    C: 1.0
    max_iter: 1000
    random_state: *seed
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
    random_state: *seed
  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    random_state: *seed

evaluate:
  threshold: 0.245
  min_roc_auc: 0.99

validate:
  min_rows: 5000
  max_missing_share: 0.05
  target_rate: [0.05, 0.60]

mlflow:
  enabled: true
  tracking_uri: http://localhost:5000
  experiment_name: churn
  registered_model_name: churn-classifier

service:
  model_stage: Production
  model_path: models/model.joblib