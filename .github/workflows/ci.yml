name: CI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер
        run: ruff check src tests

      - name: Тесты
        run: pytest --cov=src --cov-report=term-missing

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Воспроизвести пайплайн
        run: |
          python -m src.data.generate --n 4000
          python -m src.data.prepare
          python -m src.train --no-mlflow
          python -m src.evaluate

      - name: Опубликовать метрики
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: reports/

      - name: Опубликовать метрики в PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = JSON.parse(fs.readFileSync('reports/eval_metrics.json', 'utf8'));
            const res = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'reports/eval_metrics.json',
                ref: 'main',
              });
            const base = JSON.parse(Buffer.from(res.data.content, 'base64').toString('utf8'));
            const fmt = (v) => (v === undefined || v === null ? '—' : v.toFixed(4));
            const table = (m) => [
              '| Метрика | Значение |',
              '|---|---|',
              `| ROC-AUC | ${fmt(m.roc_auc)} |`,
              `| PR-AUC | ${fmt(m.pr_auc)} |`,
              `| F1 | ${fmt(m.f1)} |`,
            ];
            const parts = ['## Метрики этого PR', '', ...table(pr)];
            parts.push('', '### Baseline (`main`)', '', ...table(base));
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: parts.join('\n'),
            });