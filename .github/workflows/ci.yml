name: CI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер
        run: ruff check src tests

      - name: Тесты
        run: pytest --cov=src --cov-report=term-missing

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Воспроизвести пайплайн
        run: |
          python -m src.data.generate --n 4000
          python -m src.data.prepare
          python -m src.train --no-mlflow
          python -m src.evaluate

      - name: Опубликовать метрики
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: reports/

      - name: Опубликовать метрики в PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('reports/eval_metrics.json')).metrics;
            const body = [
              '## Метрики этого PR',
              '',
              '| Метрика | Значение |',
              '|---|---|',
              `| ROC-AUC | ${m.roc_auc.toFixed(4)} |`,
              `| PR-AUC | ${m.pr_auc.toFixed(4)} |`,
              `| F1 | ${m.f1.toFixed(4)} |`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });